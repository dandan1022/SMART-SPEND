# Optional: deploy as a Render Blueprint (New -> Blueprint).
# SQLite is temporary on Render Free. For permanent storage, add DATABASE_URL privately in Render Environment.
services:
  - type: web
    name: smart-spend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SMARTSPEND_TZ
        value: Asia/Manila
      - key: SMARTSPEND_SECURE_COOKIE
        value: "1"
      - key: SMARTSPEND_ADMIN_EMAIL
        value: adminsmartspend@2026
      - key: SMARTSPEND_ADMIN_PASSWORD
        sync: false
      # Set DATABASE_URL manually in Render Environment after creating a hosted PostgreSQL database.
      # Never put the database connection string in public GitHub.